services:
  db:
    image: supabase/postgres:17.6.1.178
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    networks: [backend] # no published port: only the server can reach the database
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      retries: 20

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      TOTP_KEY: ${TOTP_KEY:?Set TOTP_KEY in .env (openssl rand -hex 32)}
    networks: [backend, frontend]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  expo:
    build: ./app
    environment:
      # Metro must advertise an address the phone can reach, not the container IP.
      REACT_NATIVE_PACKAGER_HOSTNAME: ${EXPO_HOST:-127.0.0.1}
      EXPO_START_ARGS: ${EXPO_START_ARGS:-}
      EXPO_NO_TELEMETRY: "1"
    ports:
      - "8081:8081"
    volumes:
      - ./app:/app:z # :z = SELinux label so the container can read it (Fedora/RHEL)
      - /app/node_modules # keep the image's node_modules, not the host's
    tty: true
    stdin_open: true

networks:
  backend:
    internal: true # no route to the host or the internet
  frontend: {} # published ports need a non-internal network

volumes:
  db-data:
